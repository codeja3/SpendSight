[project]
name = "spendsight"
version = "0.1.0"
description = "Privacy-first local personal finance pipeline and terminal dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "instructor>=1.7.0",
    "openai>=1.60.0",
    "pdfplumber>=0.11.0",
    "plotext>=5.2.8",
    "polars>=1.20.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "textual>=1.0.0",
    "textual-plotext>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
