profiles:
  # Profile for checking account
  checking:
    skip_rows: 0
    sign_multiplier: 1
    date_format: "%m/%d/%Y"
    column_mapping:
      "Posting Date": "date"
      "Description": "raw_description"
      "Amount": "amount"

  # First Credit Card Profile
  credit_account:
    skip_rows: 0
    sign_multiplier: 1
    date_format: "%m/%d/%Y"
    column_mapping:
      "Transaction Date": "date"
      "Description": "raw_description"
      "Amount": "amount"

  # Profile for credit accounts that use separate Debit and Credit columns.
  # The system will automatically synthesize the canonical amount as (Credit - Debit).
  credit_account_with_split:
    skip_rows: 0
    sign_multiplier: 1
    date_format: "%Y-%m-%d"
    column_mapping:
      "Transaction Date": "date"
      "Description": "raw_description"
      "Debit": "debit"
      "Credit": "credit"

